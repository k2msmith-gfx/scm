[package]
name = "scm-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The scm binary: a REPL and a script runner"

[[bin]]
name = "scm"
path = "src/main.rs"

# `jit` links LLVM through scm-llvm and enables `SCM_TIER=t2`. Without a
# toolchain it fails loudly in llvm-sys, which is the plan §5 gate in its
# final form; the default build needs no LLVM.
[features]
jit = ["dep:scm-llvm"]

[dependencies]
# The package is `schemers`; the library it builds is `scm`, so the
# `use scm::…` below are unchanged.
schemers = { path = "../scm" }
scm-llvm = { path = "../scm-llvm", optional = true }
# Line editing, history and multi-line entry for the terminal client. The
# multi-line decision still comes from the session's own parse op.
rustyline = "17"
